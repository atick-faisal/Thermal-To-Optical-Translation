# Run with `prek`. This is the PLAN.md §14 pre-push gate made automatic: ruff, pyright and
# the fast tests are the only things verifiable on the dev machine, since neither the
# training data nor the detector weights exist here.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Run through uv so the hooks see the project venv rather than prek's isolated one.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-fast
        name: pytest (fast)
        entry: uv run pytest -m "not slow" -q
        language: system
        types: [python]
        pass_filenames: false
