[project]
name = "thermal-to-optical-translation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Atick Faisal", email = "atickfaisal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "wandb>=0.28.1",
]

[project.scripts]
thermal-to-optical-translation = "thermal_to_optical_translation:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.4.13",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]
