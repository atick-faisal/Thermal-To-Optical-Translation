# E3's coupled arm -- the real lambda_det ramp [0,1,2,3] (TASKS.md M1.2).
#
# Identical to the sibling experiments/e3_pix2pix_control.yaml except `coupling.task_weights`
# and `runtime.name`. See that file's header for what E3 tests, why stage 0 is a free null
# control, why the campaign runs six seeds, and the placeholder-path convention. The
# differ-only-by-two-fields invariant is pinned by
# tests/test_e3_experiments.py::test_control_and_loop_configs_differ_only_by_design.
#
# Read `detector.in_loop.weights` with care in this file, unlike in the control: stages 1-3
# have lambda_det > 0, so that checkpoint's gradient trains the translator here. It is
# deliberately NOT the same detector as `detector.reference.weights` below, which is what makes
# E3's numbers separable from reward hacking (engine/loop.py warns at run start if they ever
# resolve to the same file).

data:
  manifest: dataset/yolo_rgbt/data.yaml
  annotation_fraction: 1.0
  annotation_seed: 0

train:
  epochs_per_stage: 100
  batch_size: 8
  lr: 2.0e-4
  lr_gamma: 0.95
  amp: true
  amp_dtype: bfloat16
  hflip: 0.5
  crop: null
  seed: 0

loss:
  l2: 1.0
  lpips: 5.0
  gan: 1.0

coupling:
  # The coupled arm: lambda_det = 0, 1, 2, 3. Stage 0 is weight 0 in BOTH arms, which is what
  # makes the paired stage-0 difference a within-experiment measurement of run-to-run noise.
  task_weights: [0.0, 1.0, 2.0, 3.0]
  # Calibrated, not inherited: at AlignProp's 1.0e-2 the detection term was 2.3% of the
  # objective and E3's null was uninterpretable (TASKS.md M1.2 steps 7-8). 0.15 puts the ramp
  # at 11/17/23%. Re-measure with `scripts/loss_share.py` if any loss weight above changes.
  grad_scale: 0.15
  reward_target: null

detector:
  in_loop:
    # This DOES matter here: stages 1-3 couple in this frozen detector. Point at the optical
    # (visible-trained) yolo11n already on the server -- the same checkpoint M1 used, so E3's
    # coupled arm is the same method M1 measured, only budget-matched and honestly judged.
    weights: yolo11n.pt
    imgsz: 640
  evaluation:
    init_weights: yolo11n.pt
    epochs: 50
    imgsz: 640
    batch: 16
  reference:
    # M1.2 step 1's independently-trained judge (yolo11s, seed 1, visible train split only).
    # Must be identical to the control arm's, and must NOT be in_loop.weights above -- see
    # that file's fuller note on why this is a concrete path rather than null.
    weights: runs/reference-yolo11s/weights/best.pt
    imgsz: 640
    batch: 16

translator:
  backbone: pix2pix
  net_g: resnet_9blocks
  net_d: basic
  ngf: 64
  ndf: 64
  gan_mode: vanilla

metrics:
  lpips_net: alex
  kid_subset_size: 50
  iou_threshold: 0.5
  conf_threshold: 0.25

export:
  normalize: clamp

runtime:
  device: null
  workers: 16
  wandb: false
  wandb_project: thermal-to-optical
  group: e3-pix2pix
  run_dir: runs
  name: e3-pix2pix-loop
